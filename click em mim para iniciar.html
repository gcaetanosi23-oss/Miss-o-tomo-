
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missão Átomo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-icons">
</div>

<header class="hero">
  <h1>⚛️ Missão Átomo</h1>
  <p>Desafios de química e estrutura eletrônica</p>
</header>

<section class="status-panel">
  <div class="status-item">
    <span>⭐</span>
    <h2>Pontos</h2>
    <p id="points">0</p>
  </div>

  <div class="status-item">
    <span>🌍</span>
    <h2>Mundo</h2>
    <p>1 / 5</p>
  </div>

  <div class="status-item">
    <span>🔥</span>
    <h2>Streak</h2>
    <p id="streak">0</p>
  </div>

  
</section>

<h2 class="section-title">Selecione um Jogo</h2>

<main class="games">

  <a class="game-card green" href="indexblocoA.html">
    <div class="badge">1</div>

    <div class="game-info">
      <h3>Quiz: Distribuição Eletrônica</h3>
      <p>Preencha os elétrons conforme o diagrama de Linus Pauling.</p>
    </div>

    <div class="icon">⚛️</div>
  </a>

  <a class="game-card purple" href="indexblocoB.html">
    <div class="badge">2</div>

    <div class="game-info">
      <h3>Orbitais Quest</h3>
      <p>Responda, construa e supere desafios sobre orbitais.</p>
    </div>

    <div class="icon">🧪</div>
  </a>

</main>

<footer>
  <button class="achievement-btn">🏆 Conquistas</button>
</footer>

<script src="storage.js"></script>
<script src="script.js"></script>
</body>
</html>
