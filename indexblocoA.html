<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Distribuição Eletrônica</title>
    <link rel="stylesheet" href="styleblocoA.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <div class="w-full max-w-5xl mx-auto p-4 md:p-8">
        <header class="text-center mb-8">
            <a href="index.html" class="inline-block mb-4 text-blue-100 hover:text-white underline">← Voltar ao Menu</a>
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-2">Quiz: Distribuição Eletrônica</h1>
            <p class="text-xl text-blue-100 mb-2">Missões variadas sobre estrutura eletrônica dos elementos.</p>
        </header>

        <!-- Menu de slots (mesmo modelo de 3 perfis usado no Orbitais Quest) -->
        <section id="saveMenu" class="save-menu-a">
            <p class="text-center text-blue-100 mb-6">Escolha um slot para carregar ou iniciar um novo jogo</p>
            <div id="slotsContainerA" class="slots-container-a"></div>
        </section>

        <main id="gameContent" class="hidden">
            <div class="text-center mb-4">
                <button id="btnVoltarMenuA" class="text-sm text-blue-100 hover:text-white underline">← Trocar de slot</button>
            </div>

            <!-- Painel de informações do elemento e pontuação -->
            <section class="info-panel shadow-lg p-6 mb-6 flex flex-wrap justify-between items-center gap-4">
                <div>
                    <h2 class="text-sm uppercase tracking-wide text-gray-500 font-semibold">Elemento Atual</h2>
                    <p class="text-lg"><span id="elementSymbol" class="font-bold text-2xl">?</span> — <span id="elementName">Carregando...</span></p>
                    <p class="text-sm text-gray-600">Número Atômico (Z) = <span id="atomicNumberDisplay" class="font-bold">?</span></p>
                </div>
                <div class="text-right">
                    <h2 class="text-sm uppercase tracking-wide text-gray-500 font-semibold">Pontuação</h2>
                    <p id="scoreDisplay" class="text-2xl font-bold text-blue-600">0</p>
                    <p class="text-xs text-gray-500">Streak: <span id="streakDisplay">0</span></p>
                </div>
            </section>

            <!-- Badge do desafio atual -->
            <section class="challenge-header shadow-lg p-5 mb-6">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
                    <div class="flex items-center gap-2">
                        <span id="challengeIcon" class="text-2xl">🧪</span>
                        <h3 id="challengeTitle" class="text-xl font-bold text-gray-800">Desafio</h3>
                    </div>
                    <div class="flex items-center gap-2">
                        <span id="levelBadge" class="badge-pill">Nível 1</span>
                        <span id="pointsBadge" class="badge-pill badge-points">+0 pts</span>
                    </div>
                </div>
                <div id="questionText" class="question-box">
                    Carregando pergunta...
                </div>
            </section>

            <!-- Área de resposta dinâmica -->
            <section class="bg-white rounded-xl shadow-lg p-6 mb-6">
                <div id="answerArea">
                    <!-- Preenchido dinamicamente pelo JS conforme o tipo de desafio -->
                </div>

                <div class="text-center mt-8">
                    <button id="checkAnswerBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-xl transition-all transform hover:scale-105">
                        Verificar Resposta
                    </button>
                    <button id="nextChallengeBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl transition-all transform hover:scale-105 hidden">
                        Próximo Desafio →
                    </button>
                </div>
            </section>

            <!-- Feedback detalhado -->
            <section id="feedbackSection" class="hidden mb-8">
                <div id="feedbackArea"></div>
                <div id="stepFeedback" class="step-feedback"></div>
                <div id="conceptBox" class="concept-box hidden"></div>
            </section>
        </main>
    </div>

    <script src="storage.js"></script>
    <script src="scriptblocoA.js"></script>
</body>
</html>
